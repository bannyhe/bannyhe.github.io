
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/png" href="/mh_logo.png" />
      <link rel="apple-touch-icon" href="/mh_logo.png" />
      <!-- Every page's tab reads "MU HE" by request. og:title below stays
           descriptive so shared links still show a meaningful headline. -->
      <title>MU HE</title>
      <meta name="description" content="Portfolio of Mu He, a product designer with 6+ years of B2B SaaS experience in networking & security — UX/UI design and research." />
      <meta property="og:type" content="website" />
      <meta property="og:title" content="Mu He — Product Designer" />
      <meta property="og:description" content="Portfolio of Mu He, a product designer specializing in B2B SaaS networking & security experiences." />
      <meta property="og:image" content="https://muheportfolio.com/og-image.jpg" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta property="og:image:alt" content="Mu He — Product Designer. B2B SaaS, networking and security." />
      <meta property="og:url" content="https://muheportfolio.com/" />
      <meta property="og:site_name" content="Mu He" />
      <link rel="canonical" href="https://muheportfolio.com/" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:image" content="https://muheportfolio.com/og-image.jpg" />
      <meta name="twitter:title" content="Mu He — Product Designer" />
      <meta name="twitter:description" content="Portfolio of Mu He, a product designer specializing in B2B SaaS networking & security experiences." />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet" />
    </head>

    <body>
      <script>
        // The site used to route on the hash (muheportfolio.com/#/about). Rewrite
        // those legacy URLs to real paths before the router boots, so links shared
        // or bookmarked previously still land on the right page. Plain in-page
        // anchors like #projects are left alone.
        (function () {
          try {
            if (window.location.hash.indexOf('#/') === 0) {
              var target = window.location.hash.slice(1) || '/';
              window.history.replaceState(
                null,
                '',
                target + window.location.search
              );
            }
          } catch (e) {}
        })();
      </script>
      <script>
        // Apply the theme before first paint so a device in dark mode never
        // flashes light. Mirrors ThemeContext: an explicit saved choice wins,
        // otherwise follow the device appearance.
        (function () {
          try {
            var saved = localStorage.getItem('theme');
            var isDark =
              saved === 'dark' ||
              (saved !== 'light' &&
                window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', isDark);
          } catch (e) {}
        })();
      </script>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
