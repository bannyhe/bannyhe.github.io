<text x="56" y="446" font-size="13" font-weight="400" fill="#41505F">Pros:  Impossible to miss</text>
<text x="56" y="468" font-size="13" font-weight="400" fill="#41505F">Cons:  Blocks the console, and closing loses the tutorial</text>
