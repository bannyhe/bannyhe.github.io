<text x="1008" y="422" font-size="16" font-weight="700" fill="#102F56">C &#183; Minimized non-modal dialog</text>
<text x="1008" y="446" font-size="13" fill="#41505F">Keeps:  Tracks progress, reopens on</text>
<text x="1008" y="464" font-size="13" fill="#41505F">demand</text>
