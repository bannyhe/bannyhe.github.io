      <text x="1030" y="274">Infrastructure</text>
      <text x="1030" y="303">Diagnostics</text>
      <text x="1030" y="332">Security</text>
    </g>
    <rect x="1023" y="348" width="104" height="30" rx="3" fill="#DDECF5"/>
