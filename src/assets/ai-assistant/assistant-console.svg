    <text x="1151" y="412" fill="#708490" font-size="9">vMotion diagnostics</text>
    <path d="M1268 248V775" stroke="#DFE7ED"/>

    <rect x="1287" y="263" width="448" height="33" rx="4" fill="white" stroke="#CADAE5"/>
    <circle cx="1303" cy="278" r="4" stroke="#7B929F"/>
    <path d="M1306 282L1310 286" stroke="#7B929F"/>
