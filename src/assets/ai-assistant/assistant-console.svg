      <text x="1356" y="552">Review the proposed remediation plan</text>
      <text x="1356" y="577">Verify the outcome after taking action</text>
    </g>
    <text x="1336" y="605" fill="#6E8492" font-size="8">Review recommendations before making changes.</text>
    <text x="1322" y="645" fill="#1B7EAB" font-size="9">Explore related objects</text>
    <text x="1469" y="645" fill="#1B7EAB" font-size="9">Ask a follow-up</text>

